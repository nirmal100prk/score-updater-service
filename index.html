<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Example</title>
</head>
<body>
    <h1>WebSocket Data Update</h1>
    <div id="data-container">Waiting for data...</div>

    <script>
        // Create a new WebSocket connection
        const socket = new WebSocket('ws://localhost:7003/ws');

        // Connection opened
        socket.addEventListener('open', (event) => {
            console.log('WebSocket connection opened:', event);
        });

        // Listen for messages from the server
        socket.addEventListener('message', (event) => {
            console.log('Message from server:', event.data);

            // Update the content of the div with the received data
            const dataContainer = document.getElementById('data-container');
            dataContainer.textContent = event.data;
        });

        // Handle errors
        socket.addEventListener('error', (event) => {
            console.error('WebSocket error:', event);
        });

        // Connection closed
        socket.addEventListener('close', (event) => {
            console.log('WebSocket connection closed:', event);
        });
    </script>
</body>
</html>
